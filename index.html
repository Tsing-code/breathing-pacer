<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Breathing Pacer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EAF1EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1614" media="(prefers-color-scheme: dark)">
<meta name="description" content="A guided breathing pacer: box breathing (4-4-4-4) and 4-7-8.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Breathe">

<style>
  @font-face {
    font-family: 'Fraunces';
    font-style: normal;
    font-weight: 300 500;
    font-display: swap;
    src: url(fonts/fraunces-latin.woff2) format('woff2');
  }
  @font-face {
    font-family: 'Manrope';
    font-style: normal;
    font-weight: 400 700;
    font-display: swap;
    src: url(fonts/manrope-latin.woff2) format('woff2');
  }

  :root {
    --bg: #EAF1EE;
    --ink: #1C2B29;
    --ink-soft: #587068;
    --accent: #2F6F63;
    --accent-soft: rgba(47, 111, 99, 0.14);
    --dot: #D98A3D;
    --dot-glow: rgba(217, 138, 61, 0.38);
    --pill-bg: rgba(47, 111, 99, 0.1);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1614;
      --ink: #E3EFEA;
      --ink-soft: #8FAFA6;
      --accent: #6FB6A8;
      --accent-soft: rgba(111, 182, 168, 0.16);
      --dot: #F0A857;
      --dot-glow: rgba(240, 168, 87, 0.42);
      --pill-bg: rgba(111, 182, 168, 0.12);
    }
  }

  :root[data-theme="dark"] {
    --bg: #0E1614;
    --ink: #E3EFEA;
    --ink-soft: #8FAFA6;
    --accent: #6FB6A8;
    --accent-soft: rgba(111, 182, 168, 0.16);
    --dot: #F0A857;
    --dot-glow: rgba(240, 168, 87, 0.42);
    --pill-bg: rgba(111, 182, 168, 0.12);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { margin: 0; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Manrope', system-ui, sans-serif;
    padding: max(2rem, env(safe-area-inset-top)) max(1.25rem, env(safe-area-inset-right))
             max(2rem, env(safe-area-inset-bottom)) max(1.25rem, env(safe-area-inset-left));
    user-select: none;
    -webkit-user-select: none;
  }

  .widget {
    width: 100%;
    max-width: 22rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.25rem;
  }

  .eyebrow {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .mode-switch {
    display: flex;
    gap: 0.3rem;
    padding: 0.25rem;
    background: var(--pill-bg);
    border-radius: 999px;
  }

  .mode-btn {
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--ink-soft);
    background: transparent;
    border: none;
    border-radius: 999px;
    min-height: 2.75rem;
    padding: 0 1.1rem;
    cursor: pointer;
    touch-action: manipulation;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .mode-btn[aria-pressed="true"] {
    background: var(--accent);
    color: var(--bg);
  }

  .mode-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .mode {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
    width: 100%;
  }

  .mode.active { display: flex; }

  .phase-stage {
    position: relative;
    width: 100%;
    height: 2.6rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .phase-label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 480;
    font-size: 1.9rem;
    color: var(--accent);
    opacity: 0;
  }

  /* box mode: four equal 4s phases on one shared 16s timeline, staggered by delay */
  .box-mode .phase-label { animation: phaseFadeBox 16s infinite; }
  .box-mode .phase-label:nth-child(1) { animation-delay: 0s; }
  .box-mode .phase-label:nth-child(2) { animation-delay: -4s; }
  .box-mode .phase-label:nth-child(3) { animation-delay: -8s; }
  .box-mode .phase-label:nth-child(4) { animation-delay: -12s; }

  @keyframes phaseFadeBox {
    0%    { opacity: 0; }
    2%    { opacity: 1; }
    23%   { opacity: 1; }
    25%   { opacity: 0; }
    100%  { opacity: 0; }
  }

  /* 4-7-8 mode: three unequal phases (4s / 7s / 8s of 19s), each its own keyframe */
  .relax-mode .phase-label.in   { animation: phaseFadeRelaxIn 19s infinite; }
  .relax-mode .phase-label.hold { animation: phaseFadeRelaxHold 19s infinite; }
  .relax-mode .phase-label.out  { animation: phaseFadeRelaxOut 19s infinite; }

  @keyframes phaseFadeRelaxIn {
    0%   { opacity: 0; }
    1%   { opacity: 1; }
    19%  { opacity: 1; }
    21%  { opacity: 0; }
    100% { opacity: 0; }
  }
  @keyframes phaseFadeRelaxHold {
    0%   { opacity: 0; }
    21%  { opacity: 0; }
    23%  { opacity: 1; }
    56%  { opacity: 1; }
    58%  { opacity: 0; }
    100% { opacity: 0; }
  }
  @keyframes phaseFadeRelaxOut {
    0%   { opacity: 0; }
    58%  { opacity: 0; }
    60%  { opacity: 1; }
    99%  { opacity: 1; }
    100% { opacity: 0; }
  }

  .stage {
    position: relative;
    width: min(18rem, 82vw);
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .glow {
    position: absolute;
    inset: 0.5rem;
    border-radius: 1.4rem;
    background: radial-gradient(circle, var(--accent-soft), transparent 72%);
    transform: scale(1);
  }

  @media (prefers-reduced-motion: no-preference) {
    .box-mode .glow { animation: breathePulseBox 16s infinite; }
    .relax-mode .glow { animation: breathePulseRelax 19s infinite; }
  }

  @keyframes breathePulseBox {
    0%   { transform: scale(1); }
    25%  { transform: scale(1.12); }
    50%  { transform: scale(1.12); }
    75%  { transform: scale(1); }
    100% { transform: scale(1); }
  }

  @keyframes breathePulseRelax {
    0%   { transform: scale(1); }
    21%  { transform: scale(1.14); }
    58%  { transform: scale(1.14); }
    100% { transform: scale(1); }
  }

  svg { position: relative; width: 100%; height: 100%; overflow: visible; }

  .box-outline {
    fill: none;
    stroke: var(--accent);
    stroke-width: 3;
    stroke-linejoin: round;
    opacity: 0.55;
  }

  .corner {
    fill: var(--accent);
    opacity: 0.75;
  }

  .dot {
    fill: var(--dot);
    filter: drop-shadow(0 0 10px var(--dot-glow));
  }

  .meta-row {
    display: flex;
    align-items: center;
    gap: 0.85rem;
  }

  button.toggle {
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--bg);
    background: var(--accent);
    border: none;
    border-radius: 999px;
    min-height: 2.75rem;
    padding: 0 1.6rem;
    cursor: pointer;
    touch-action: manipulation;
    transition: opacity 0.15s ease;
  }

  button.toggle:hover { opacity: 0.88; }
  button.toggle:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .cycles {
    font-size: 0.8rem;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  .instructions {
    text-align: center;
    font-size: 0.85rem;
    line-height: 1.5;
    color: var(--ink-soft);
    max-width: 20rem;
    margin: 0;
  }
</style>
</head>
<body>
<div class="widget">
  <div class="eyebrow">Breathing Pacer</div>

  <div class="mode-switch" role="group" aria-label="Breathing pattern">
    <button class="mode-btn" id="btnBox" type="button" aria-pressed="true">Box · 4-4-4-4</button>
    <button class="mode-btn" id="btnRelax" type="button" aria-pressed="false">4-7-8</button>
  </div>

  <!-- BOX MODE -->
  <div class="mode box-mode active" id="boxMode">
    <div class="phase-stage" aria-live="polite">
      <span class="phase-label">Breathe in</span>
      <span class="phase-label">Hold</span>
      <span class="phase-label">Breathe out</span>
      <span class="phase-label">Hold</span>
    </div>

    <div class="stage">
      <div class="glow"></div>
      <svg viewBox="0 0 240 240" aria-hidden="true">
        <rect class="box-outline" x="20" y="20" width="200" height="200" rx="16" />
        <circle class="corner" cx="20" cy="220" r="3" />
        <circle class="corner" cx="20" cy="20" r="3" />
        <circle class="corner" cx="220" cy="20" r="3" />
        <circle class="corner" cx="220" cy="220" r="3" />
        <circle class="dot" r="7">
          <animateMotion dur="16s" repeatCount="indefinite"
            path="M 20 220 L 20 20 L 220 20 L 220 220 Z" />
        </circle>
      </svg>
    </div>

    <p class="instructions">Follow the dot around the box — in for four counts, hold for four, out for four, hold for four.</p>
  </div>

  <!-- 4-7-8 MODE -->
  <div class="mode relax-mode" id="relaxMode">
    <div class="phase-stage" aria-live="polite">
      <span class="phase-label in">Breathe in</span>
      <span class="phase-label hold">Hold</span>
      <span class="phase-label out">Breathe out</span>
    </div>

    <div class="stage">
      <div class="glow"></div>
      <svg viewBox="0 0 240 240" aria-hidden="true">
        <path class="box-outline" d="M 32 158.5 L 74.61 81.5 L 208 158.5 Z" />
        <circle class="corner" cx="32" cy="158.5" r="3" />
        <circle class="corner" cx="74.61" cy="81.5" r="3" />
        <circle class="corner" cx="208" cy="158.5" r="3" />
        <circle class="dot" r="7">
          <animateMotion dur="19s" repeatCount="indefinite"
            path="M 32 158.5 L 74.61 81.5 L 208 158.5 Z" />
        </circle>
      </svg>
    </div>

    <p class="instructions">Inhale through the nose for four counts, hold for seven, exhale slowly through the mouth for eight.</p>
  </div>

  <div class="meta-row">
    <button class="toggle" id="toggleBtn" type="button">Pause</button>
    <span class="cycles" id="cycles">Cycles: 0</span>
  </div>
</div>

<script>
  const modes = {
    box:   { el: document.getElementById('boxMode'),   dur: 16, btn: document.getElementById('btnBox') },
    relax: { el: document.getElementById('relaxMode'), dur: 19, btn: document.getElementById('btnRelax') }
  };

  const toggleBtn = document.getElementById('toggleBtn');
  const cyclesEl = document.getElementById('cycles');

  let current = 'box';
  let running = true;
  let shownCycles = 0;

  function parts(name) {
    const root = modes[name].el;
    return {
      svg: root.querySelector('svg'),
      css: [...root.querySelectorAll('.phase-label'), root.querySelector('.glow')]
    };
  }

  function restartCss(el) {
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = '';
    el.style.animationPlayState = '';
  }

  // Keep the screen awake while a session is running.
  let wakeLock = null;
  async function holdScreen() {
    try {
      if ('wakeLock' in navigator && !wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (e) { /* not granted: the pacer still works */ }
  }
  function releaseScreen() {
    if (wakeLock) { wakeLock.release(); wakeLock = null; }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && running) holdScreen();
  });

  function begin() {
    const { svg, css } = parts(current);
    svg.setCurrentTime(0);
    svg.unpauseAnimations();
    css.forEach(restartCss);
    shownCycles = 0;
    cyclesEl.textContent = 'Cycles: 0';
    running = true;
    toggleBtn.textContent = 'Pause';
    holdScreen();
  }

  function pause() {
    const { svg, css } = parts(current);
    svg.pauseAnimations();
    css.forEach(el => { el.style.animationPlayState = 'paused'; });
    running = false;
    toggleBtn.textContent = 'Resume';
    releaseScreen();
  }

  function resume() {
    const { svg, css } = parts(current);
    svg.unpauseAnimations();
    css.forEach(el => { el.style.animationPlayState = ''; });
    running = true;
    toggleBtn.textContent = 'Pause';
    holdScreen();
  }

  function switchMode(name) {
    if (name === current) return;
    parts(current).svg.pauseAnimations();
    modes[current].el.classList.remove('active');
    modes[current].btn.setAttribute('aria-pressed', 'false');
    current = name;
    modes[current].el.classList.add('active');
    modes[current].btn.setAttribute('aria-pressed', 'true');
    begin();
  }

  // Cycles come from the animation's own clock, so pausing and resuming stay accurate.
  setInterval(() => {
    const n = Math.floor(parts(current).svg.getCurrentTime() / modes[current].dur);
    if (n !== shownCycles) {
      shownCycles = n;
      cyclesEl.textContent = 'Cycles: ' + n;
    }
  }, 500);

  toggleBtn.addEventListener('click', () => { running ? pause() : resume(); });
  modes.box.btn.addEventListener('click', () => switchMode('box'));
  modes.relax.btn.addEventListener('click', () => switchMode('relax'));

  begin();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
